<!DOCTYPE html>
<html lang="en" class="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volunteer & Work Programme 2027</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- The CDN defines `tailwind`; then the local config extends its theme. -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./tailwind-config.js"></script>

    <!-- FullCalendar -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

    <!-- jsPDF & jsPDF-AutoTable -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="./styles.css">
</head>

<body
    class="flex flex-col min-h-screen bg-zinc-50 dark:bg-zinc-900 text-zinc-900 dark:text-zinc-100 transition-colors duration-200">

    <!-- Top Navigation Bar -->
    <header
        class="bg-zinc-900 dark:bg-black text-white p-4 flex flex-wrap justify-between items-center shrink-0 shadow-md z-20 relative gap-4 transition-colors duration-200">
        <div class="flex items-center gap-3 w-full md:w-auto justify-center md:justify-start">
            <i data-lucide="clipboard-list" class="w-6 h-6 text-zinc-300"></i>
            <h1 class="text-xl font-semibold tracking-wide">Volunteer Plan <span
                    class="font-normal opacity-70 ml-1">2027</span></h1>
        </div>
        <div class="flex flex-wrap items-center justify-center md:justify-end gap-3 w-full md:w-auto">
            <!-- Dark Mode Toggle -->
            <button id="theme-toggle-btn" type="button" aria-label="Toggle light or dark theme" 
                class="p-2 rounded-md bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 transition-colors"
                title="Toggle Theme">
                <i data-lucide="moon" class="w-4 h-4"></i>
            </button>

            <button type="button" data-action="open-json-upload"
                class="flex items-center gap-2 bg-zinc-800 hover:bg-zinc-700 text-white border border-zinc-700 px-4 py-2 rounded-md text-sm font-medium transition-colors shadow-sm">
                <i data-lucide="upload" class="w-4 h-4"></i> Load
            </button>
            <input type="file" id="json-upload" accept=".json" class="hidden">

            <button type="button" data-action="save-json"
                class="flex items-center gap-2 bg-zinc-800 hover:bg-zinc-700 text-white border border-zinc-700 px-4 py-2 rounded-md text-sm font-medium transition-colors shadow-sm">
                <i data-lucide="save" class="w-4 h-4"></i> Save
            </button>
            <button type="button" data-action="generate-pdf"
                class="flex items-center gap-2 bg-zinc-100 hover:bg-white text-zinc-900 px-5 py-2 rounded-md text-sm font-semibold transition-colors shadow-sm">
                <i data-lucide="download" class="w-4 h-4"></i> PDF
            </button>
        </div>
    </header>

    <!-- Main Layout with Cohesive Width Constraint -->
    <div class="flex flex-col flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 gap-8">

        <!-- Main Calendar Area -->
        <main class="w-full">
            <div
                class="bg-white dark:bg-zinc-800 rounded-xl shadow-soft p-4 lg:p-6 border border-zinc-200 dark:border-zinc-700 calendar-wrapper transition-colors duration-200">
                <div id="calendar" class="h-full w-full"></div>
            </div>
        </main>

        <!-- Listed Tasks Section Grouped by Location -->
        <section
            class="w-full bg-white dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 rounded-xl p-6 lg:p-8 shadow-soft min-h-[30vh] transition-colors duration-200 mb-8">
            <div
                class="flex items-center gap-3 mb-8 text-zinc-900 dark:text-zinc-100 border-b border-zinc-100 dark:border-zinc-700 pb-4">
                <i data-lucide="layers" class="w-6 h-6 text-zinc-500 dark:text-zinc-400"></i>
                <h2 class="text-2xl font-bold tracking-tight">Task Directory by Location</h2>
            </div>
            <div id="grouped-tasks-container" class="space-y-8">
                <p
                    class="text-zinc-500 dark:text-zinc-400 italic bg-zinc-50 dark:bg-zinc-900 p-6 rounded-lg text-center border border-zinc-200 dark:border-zinc-800">
                    No tasks added yet. Click on the calendar to add tasks.
                </p>
            </div>
        </section>

    </div>

    <!-- Modals -->

    <!-- 1. Task Modal -->
    <div id="task-modal" class="fixed inset-0 bg-zinc-900/60 hidden items-center justify-center z-40 p-4">
        <div
            class="bg-white dark:bg-zinc-900 rounded-xl shadow-modal w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden animate-in fade-in zoom-in-95 duration-200 border border-zinc-200 dark:border-zinc-800">
            <!-- Modal Header -->
            <div
                class="p-5 border-b border-zinc-100 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-950 flex justify-between items-center shrink-0">
                <div>
                    <h2 id="form-title"
                        class="text-lg font-semibold text-zinc-900 dark:text-zinc-100 flex items-center gap-2">
                        <i data-lucide="calendar-plus" class="w-5 h-5 text-zinc-500 dark:text-zinc-400"></i>
                        Add New Task
                    </h2>
                    <p id="selected-date-display" class="text-sm text-zinc-500 dark:text-zinc-400 mt-1">Date selected
                    </p>
                </div>
                <button type="button" data-action="close-modal"
                    class="text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 transition-colors bg-white dark:bg-zinc-800 p-1.5 rounded-md shadow-sm border border-zinc-200 dark:border-zinc-700">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Modal Content (Scrollable) -->
            <div class="flex-1 overflow-y-auto p-6 space-y-6">
                <input type="hidden" id="task-id">
                <input type="hidden" id="task-date">

                <!-- Step 1: Location -->
                <div>
                    <label class="block text-sm font-semibold text-zinc-700 dark:text-zinc-300 mb-2">1. Location /
                        Site</label>
                    <div class="flex flex-wrap gap-2 mb-3">
                        <button type="button" data-location="Brownsham"
                            class="pill px-3 py-1.5 bg-zinc-100 dark:bg-zinc-800 hover:bg-zinc-200 dark:hover:bg-zinc-700 text-zinc-700 dark:text-zinc-300 rounded-md text-xs font-medium border border-zinc-200 dark:border-zinc-700">Brownsham</button>
                        <button type="button" data-location="Peppercombe"
                            class="pill px-3 py-1.5 bg-zinc-100 dark:bg-zinc-800 hover:bg-zinc-200 dark:hover:bg-zinc-700 text-zinc-700 dark:text-zinc-300 rounded-md text-xs font-medium border border-zinc-200 dark:border-zinc-700">Peppercombe</button>
                        <button type="button" data-location="East Titchberry"
                            class="pill px-3 py-1.5 bg-zinc-100 dark:bg-zinc-800 hover:bg-zinc-200 dark:hover:bg-zinc-700 text-zinc-700 dark:text-zinc-300 rounded-md text-xs font-medium border border-zinc-200 dark:border-zinc-700">East Titchberry</button>
                        <button type="button" data-location="Dunsland"
                            class="pill px-3 py-1.5 bg-zinc-100 dark:bg-zinc-800 hover:bg-zinc-200 dark:hover:bg-zinc-700 text-zinc-700 dark:text-zinc-300 rounded-md text-xs font-medium border border-zinc-200 dark:border-zinc-700">Dunsland</button>
                        <button type="button" data-location="Explorer Days"
                            class="pill px-3 py-1.5 bg-zinc-200 dark:bg-zinc-700 hover:bg-zinc-300 dark:hover:bg-zinc-600 text-zinc-800 dark:text-zinc-200 rounded-md text-xs font-medium border border-zinc-300 dark:border-zinc-600">Explorer Days</button>
                    </div>
                    <input type="text" id="task-location" placeholder="Or enter custom location..."
                        class="w-full p-2.5 bg-zinc-50 dark:bg-zinc-950 border border-zinc-300 dark:border-zinc-700 rounded-md text-sm text-zinc-900 dark:text-zinc-100 focus:outline-none focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 transition-all">
                </div>

                <!-- Step 2: Details -->
                <div>
                    <label class="block text-sm font-semibold text-zinc-700 dark:text-zinc-300 mb-2">2. Task
                        Details</label>
                    <!-- Presets -->
                    <div
                        class="bg-zinc-100 dark:bg-zinc-800/50 p-4 rounded-md border border-zinc-200 dark:border-zinc-700 mb-2">
                        <label
                            class="block text-xs font-semibold text-zinc-500 dark:text-zinc-400 mb-3 flex items-center gap-1.5">
                            <i data-lucide="zap" class="w-4 h-4 text-zinc-500 dark:text-zinc-400"></i> Quick Task
                            Presets
                        </label>

                        <div id="presets-container" class="flex flex-wrap gap-2">
                            <!-- Populated by JS -->
                        </div>
                    </div>

                    <input type="text" id="task-title" placeholder="Task Title (e.g. Scrub removal)"
                        class="w-full p-2.5 bg-zinc-50 dark:bg-zinc-950 border border-zinc-300 dark:border-zinc-700 rounded-md text-sm mb-2 text-zinc-900 dark:text-zinc-100 focus:outline-none focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 transition-all font-medium">
                    <textarea id="task-desc" rows="3" placeholder="Detailed description..."
                        class="w-full p-2.5 bg-zinc-50 dark:bg-zinc-950 border border-zinc-300 dark:border-zinc-700 rounded-md text-sm resize-none text-zinc-900 dark:text-zinc-100 focus:outline-none focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 transition-all"></textarea>



                </div>

                <hr class="border-zinc-200 dark:border-zinc-800">

                <!-- Step 3: Equipment -->
                <div>
                    <label class="block text-sm font-semibold text-zinc-700 dark:text-zinc-300 mb-2">3. Equipment
                        Required</label>
                    <div id="equipment-chips" class="flex flex-wrap gap-2 mb-3">
                        <!-- Chip classes updated via JS -->
                        <button type="button" class="chip px-3 py-1.5 border rounded-md text-xs font-medium transition-colors" data-value="Sturdy boots">
                            Sturdy boots
                        </button>
                        <button type="button" class="chip px-3 py-1.5 border rounded-md text-xs font-medium transition-colors" data-value="Waterproofs">
                            Waterproofs
                        </button>
                        <button type="button" class="chip px-3 py-1.5 border rounded-md text-xs font-medium transition-colors" data-value="Packed lunch">
                            Packed lunch
                        </button>
                        <button type="button" class="chip px-3 py-1.5 border rounded-md text-xs font-medium transition-colors" data-value="Wellies">
                            Wellies
                        </button>
                        <button type="button" class="chip px-3 py-1.5 border rounded-md text-xs font-medium transition-colors" data-value="Cake">
                            Cake
                        </button>

                        <button type="button" class="chip px-3 py-1.5 border rounded-md text-xs font-medium transition-colors" data-value="Scythe">
                            Scythe
                        </button>
                    </div>
                    <input type="text" id="task-equip-custom" placeholder="Other equipment..."
                        class="w-full p-2.5 bg-zinc-50 dark:bg-zinc-950 border border-zinc-300 dark:border-zinc-700 rounded-md text-sm text-zinc-900 dark:text-zinc-100 focus:outline-none focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 transition-all">
                </div>

                <!-- Step 4: Difficulty -->
                <div>
                    <label class="block text-sm font-semibold text-zinc-700 dark:text-zinc-300 mb-2">4. Select
                        Difficulty</label>
                    <div class="grid grid-cols-3 gap-3">
                        <div class="diff-card text-center p-3 rounded-lg border-2 border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-950 hover:bg-zinc-50 dark:hover:bg-zinc-900"
                            data-diff="Easy" role="button" tabindex="0" aria-pressed="false">
                            <div class="w-3 h-3 rounded-full bg-green-500 dark:bg-green-400 mx-auto mb-1"></div>
                            <span class="text-xs font-semibold text-zinc-700 dark:text-zinc-300">Easy</span>
                        </div>
                        <div class="diff-card text-center p-3 rounded-lg border-2 border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-950 hover:bg-zinc-50 dark:hover:bg-zinc-900"
                            data-diff="Moderate" role="button" tabindex="0" aria-pressed="false">
                            <div class="w-3 h-3 rounded-full bg-yellow-500 dark:bg-yellow-400 mx-auto mb-1"></div>
                            <span class="text-xs font-semibold text-zinc-700 dark:text-zinc-300">Moderate</span>
                        </div>
                        <div class="diff-card text-center p-3 rounded-lg border-2 border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-950 hover:bg-zinc-50 dark:hover:bg-zinc-900"
                            data-diff="Strenuous" role="button" tabindex="0" aria-pressed="false">
                            <div class="w-3 h-3 rounded-full bg-red-500 dark:bg-red-400 mx-auto mb-1"></div>
                            <span class="text-xs font-semibold text-zinc-700 dark:text-zinc-300">Strenuous</span>
                        </div>
                    </div>
                    <input type="hidden" id="task-diff-value" value="">
                </div>
            </div>

            <!-- Form Actions -->
            <div
                class="p-5 border-t border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-950 shrink-0 flex gap-3 justify-end items-center">
                <button id="btn-delete" type="button" 
                    class="hidden mr-auto bg-white dark:bg-zinc-900 border border-red-200 dark:border-red-900 text-red-600 dark:text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 px-4 py-2.5 rounded-md text-sm font-semibold transition-colors items-center justify-center gap-2">
                    <i data-lucide="trash-2" class="w-4 h-4"></i> Delete
                </button>
                <button type="button" data-action="close-modal"
                    class="bg-white dark:bg-zinc-800 border border-zinc-300 dark:border-zinc-600 text-zinc-700 dark:text-zinc-300 hover:bg-zinc-50 dark:hover:bg-zinc-700 px-5 py-2.5 rounded-md text-sm font-semibold transition-colors shadow-sm">
                    Cancel
                </button>
                <button id="btn-save" type="button" 
                    class="bg-zinc-900 dark:bg-zinc-100 hover:bg-zinc-800 dark:hover:bg-white text-white dark:text-zinc-900 px-6 py-2.5 rounded-md text-sm font-semibold transition-colors flex items-center justify-center gap-2 shadow-sm">
                    <i data-lucide="calendar-check" class="w-4 h-4"></i> Save Task
                </button>
            </div>
        </div>
    </div>

    <!-- 2. Custom Dialog Modal -->
    <div id="dialog-modal" class="fixed inset-0 bg-zinc-900/60 hidden items-center justify-center z-50 p-4">
        <div
            class="bg-white dark:bg-zinc-900 rounded-xl shadow-modal w-full max-w-sm flex flex-col overflow-hidden border border-zinc-200 dark:border-zinc-800">
            <div class="p-5">
                <h3 id="dialog-title" class="text-lg font-bold text-zinc-900 dark:text-zinc-100 mb-2">Message</h3>
                <p id="dialog-msg" class="text-zinc-600 dark:text-zinc-400 text-sm"></p>
            </div>
            <div
                class="p-4 border-t border-zinc-100 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-950 flex justify-end gap-2">
                <button id="dialog-cancel"
                    class="px-4 py-2 border border-zinc-300 dark:border-zinc-600 bg-white dark:bg-zinc-800 text-zinc-700 dark:text-zinc-300 rounded hover:bg-zinc-100 dark:hover:bg-zinc-700 text-sm font-medium transition-colors hidden">Cancel</button>
                <button id="dialog-ok"
                    class="px-4 py-2 bg-zinc-900 dark:bg-zinc-100 text-white dark:text-zinc-900 rounded hover:bg-zinc-800 dark:hover:bg-white text-sm font-medium transition-colors">OK</button>
            </div>
        </div>
    </div>


    <!-- App-specific assets and logic are kept separate from the page markup. -->
    <script src="./nt-font.js"></script>
    <script src="./script.js"></script>
</body>
</html>
